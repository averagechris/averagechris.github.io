# Fleet registry: the repos that share the standard release interface.
#
# Used by `nix run .#fleet-status` and by agent-driven maintenance
# (see AGENTS.md). Every repo here is expected to expose:
#
#   nix run .#prepare-release -- --version X.Y.Z
#   nix run .#release-tag
#   nix build .#release-artifact
#   nix run .#build-pages [-- --include-existing-downloads]
#   nix run .#publish-pages
#   nix run .#release -- --version X.Y.Z [--publish-pages] [--submit-linux-build]
#   nix run .#ci-fmt | ci-clippy | ci-test
#
# plus: release manifest at builds/release-linux-x86_64.yml (explicit
# `hut builds submit` only — NOT .builds/), CHANGELOG.md with an
# `## Unreleased` section, conventional commits, vX.Y.Z tags, jj-first VCS.

[fleet]
maint_workspace_root = "/Users/chris/projects/.maint"
required_apps = [
  "prepare-release",
  "release-tag",
  "release",
  "build-pages",
  "publish-pages",
  "ci-fmt",
  "ci-clippy",
  "ci-test",
]

[[repos]]
name = "linear-cli"
local = "/Users/chris/projects/linear-cli"
pages_subdir = "linear-cli"
version_file = "Cargo.toml"
artifact_prefix = "linear-cli"
upstream = "https://github.com/Finesssee/linear-cli"
quirks = [
  "release docs live in .opencode/skills/release-process/SKILL.md; run ci-skills-render after editing skills",
  "extra ci app: ci-skills-render; extra package: homebrew-artifact",
  "keyring-only auth / no self-update / no GitHub Actions are hard policies (AGENTS.md)",
  "upstream review cutoff tracked in AGENTS.md (v0.3.26 / 42780fb as of 2026-06-15)",
]

[[repos]]
name = "slack-rs"
local = "/Users/chris/projects/slack-rs"
pages_subdir = "slack"
version_file = "Cargo.toml"
artifact_prefix = "slack"
upstream = "https://github.com/tumf/slack-rs"
quirks = [
  "publishes under /slack with slack-v* artifacts; repo dir is slack-rs, sourcehut repo is 'slack'",
  "trunk() may resolve to main@upstream (fork point) — verify against local main bookmark",
  "no hosted PR CI by policy (fork policy D7); stray legacy upstream tags like v0.1.71 exist",
  "upstream review cutoff tracked in AGENTS.md (e6a7ba03 / v0.1.71 as of 2026-07-02)",
]

[[repos]]
name = "granola-cli"
local = "/Users/chris/projects/granola-cli"
pages_subdir = "granola-cli"
version_file = "Cargo.toml"
