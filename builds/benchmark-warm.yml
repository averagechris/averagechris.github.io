image: nixos/unstable
arch: x86_64
environment:
  BENCH_CLASS: warm-custom-cache
  BENCH_EXPECTED_REVISION: f61cfe0bcacd26a3b8881dc2f7cc4ae3b12a5e8c
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.userAgent
  GIT_CONFIG_VALUE_0: averagechris-fleet-pages (+https://averagechris.srht.site)
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
    log-lines = 50
sources:
  - https://git.sr.ht/~averagechris/averagechris.srht.site
tasks:
  - timing-init: |
      set -eu
      mkdir -p "$HOME/.local/state/site-bench"
      helper="$HOME/.local/state/site-bench/helper.sh"
      printf '%s\n' \
        'bench_mark() {' \
        '  phase=$1; event=$2; rc=${3:--}' \
        '  read -r uptime _ </proc/uptime' \
        '  sec=${uptime%%.*}; frac=${uptime#*.}; frac=${frac#0}; frac=${frac:-0}' \
        '  mono_ms=$((sec * 1000 + frac * 10))' \
        '  wall=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
        '  line="BENCH\t${BENCH_CLASS}\t${phase}\t${event}\t${mono_ms}\t${wall}\t${rc}"' \
        '  printf "%b\n" "$line" | tee -a "$HOME/.local/state/site-bench/events.tsv"' \
        '}' \
        'bench_run() {' \
        '  phase=$1; shift; bench_mark "$phase" begin' \
        '  set +e; "$@"; rc=$?; set -e' \
        '  bench_mark "$phase" end "$rc"; return "$rc"' \
        '}' >"$helper"
      . "$helper"
      bench_mark observable-pre-task first-task-marker
      actual_revision="$(git -C averagechris.srht.site rev-parse HEAD)"
      test "$actual_revision" = "$BENCH_EXPECTED_REVISION"
      printf 'BENCH_META\texpected_revision\t%s\n' "$BENCH_EXPECTED_REVISION"
      printf 'BENCH_META\tactual_revision\t%s\n' "$actual_revision"
      printf 'BENCH_META\tref\t%s\n' "${GIT_REF:-unknown}"
  - flake-evaluation: |
      set -eu
      . "$HOME/.local/state/site-bench/helper.sh"
      cd averagechris.srht.site
      bench_run flake-evaluation nix flake metadata --no-write-lock-file
      bench_run refresh-app-evaluation nix eval --raw .#apps.x86_64-linux.refresh-pages.program
  - substitutions-and-validation: |
      set -eu
      . "$HOME/.local/state/site-bench/helper.sh"
      cd averagechris.srht.site
      bench_run fleet-ci-closure nix build --print-build-logs --no-link .#fleet-ci-closure
      bench_run site-data-check nix develop --command env PYTHONPATH=scripts python3 -m averagechris_site.data --check
      bench_run web-game-preset-check nix build --print-build-logs --no-link .#checks.x86_64-linux.web-game-preset
  - tests: |
      set -eu
      . "$HOME/.local/state/site-bench/helper.sh"
      cd averagechris.srht.site
      bench_run unit-tests nix develop --command env PYTHONPATH=scripts python3 -m unittest discover -s tests -v
  - publication-independent-refresh: |
      set -eu
      . "$HOME/.local/state/site-bench/helper.sh"
      cd averagechris.srht.site
      bench_run refresh-no-publish nix run .#refresh-pages -- --force --no-publish
      test -f dist/pages.tar.gz
      test -f dist/site/state.json
      printf 'BENCH_META\tpages_sha256\t%s\n' "$(sha256sum dist/pages.tar.gz | tr -s ' ' | cut -d' ' -f1)"
      printf 'BENCH_META\tpages_bytes\t%s\n' "$(stat -c %s dist/pages.tar.gz)"
  - in-job-warm-refresh: |
      set -eu
      . "$HOME/.local/state/site-bench/helper.sh"
      cd averagechris.srht.site
      bench_run refresh-no-publish-in-job-warm nix run .#refresh-pages -- --force --no-publish
      test -f dist/pages.tar.gz
  - evidence: |
      set -eu
      . "$HOME/.local/state/site-bench/helper.sh"
      bench_mark benchmark complete 0
      printf '%s\n' BENCH_EVIDENCE_BEGIN
      while IFS= read -r line; do printf '%s\n' "$line"; done <"$HOME/.local/state/site-bench/events.tsv"
      printf '%s\n' BENCH_EVIDENCE_END
