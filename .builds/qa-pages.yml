image: nixos/unstable
arch: x86_64
oauth: pages.sr.ht/PAGES:RW
environment:
  QA_DOMAIN: averagechris-qa.srht.site
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/averagechris.srht.site
tasks:
  - publish-qa: |
      cd averagechris.srht.site
      nix run .#build-pages -- --domain "$QA_DOMAIN"
      nix run .#publish-pages -- --domain "$QA_DOMAIN"
submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/qa
      - refs/heads/site-refactor
      - refs/heads/site-rendering-refactor
