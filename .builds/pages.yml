image: nixos/unstable
arch: x86_64
oauth: pages.sr.ht/PAGES:RW
environment:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/averagechris.srht.site
tasks:
  - validate: |
      cd averagechris.srht.site
      nix develop --command env PYTHONPATH=scripts python3 -m averagechris_site.data --check
      nix develop --command env PYTHONPATH=scripts python3 -m unittest discover -s tests -v
      nix build --no-link .#checks.x86_64-linux.web-game-preset
  - publish-race-safe: |
      cd averagechris.srht.site
      nix run .#refresh-pages -- --force
submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/main
