image: nixos/unstable
arch: x86_64
packages:
  - nixos.cachix
secrets:
  # Mounts ~/.ci_secrets/cachix_token for averagechris-dotfiles Cachix pushes.
  - 731f7e55-4497-4228-8fa4-1657da7d3625
environment:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/averagechris.srht.site
tasks:
  - warm-flake-outputs: |
      cd averagechris.srht.site
      cachix authtoken --stdin < ~/.ci_secrets/cachix_token
      nix build --accept-flake-config .#flake-output-cache --out-link result-flake-output-cache
      nix path-info --recursive ./result-flake-output-cache | cachix push averagechris-dotfiles
